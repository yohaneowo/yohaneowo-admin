# yohaneowo-admin on Coolify (Docker Compose build pack, compose file docker/coolify/compose.yaml).
# Everything is built from this repo on push; nothing is pulled from Docker Hub. Build contexts are
# written relative to the repo root: Coolify resolves them from there, not from this file's folder.
#
# What lives where:
# - MySQL is a separate Coolify database resource (so Coolify's scheduled backups to R2 cover it);
#   DATABASE_HOST / DATABASE_PASSWORD point at it and are set in Coolify's environment panel.
# - Redis runs here; Coolify fills SERVICE_PASSWORD_REDIS.
# - App secrets (SECRET_KEY, BOT_API_TOKEN, API keys…) come from Doppler yohaneowo-admin / prd:
#   backend starts under `doppler run` when DOPPLER_TOKEN is set.
# - web (nginx + the built frontend) gets the public domain; the bot reaches it on the shared
#   `coolify` network as http://yohaneowo-admin-web.
services:
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: ['redis-server', '--requirepass', '${SERVICE_PASSWORD_REDIS}', '--appendonly', 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
            interval: 10s
            timeout: 5s
            retries: 5
        environment:
            REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
        # Unique name: backend also sits on Coolify's shared network, where Coolify's own Redis
        # answers to plain "redis".
        networks:
            default:
                aliases:
                    - admin-redis

    backend:
        build:
            context: .
            dockerfile: docker/coolify/backend.Dockerfile
        restart: unless-stopped
        environment:
            TZ: Asia/Shanghai
            ENVIRONMENT: prod
            DEBUG: 'false'
            LOGGER_LEVEL: INFO
            DATABASE_TYPE: mysql
            DATABASE_HOST: ${DATABASE_HOST}
            DATABASE_PORT: '3306'
            DATABASE_USER: fastapiadmin
            DATABASE_PASSWORD: ${DATABASE_PASSWORD}
            DATABASE_NAME: fastapiadmin
            REDIS_HOST: admin-redis
            REDIS_PORT: '6379'
            REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
            REDIS_DB_NAME: '1'
            DOPPLER_TOKEN: ${DOPPLER_TOKEN}
            DISPLAY_TIMEZONE: Asia/Taipei
            DEMO_ENABLE: 'false'
            SCHEDULER_ALLOW_CODE_EXEC: 'false'
            # Only reached through this stack's nginx (see docker/nas/nginx.conf).
            FORWARDED_ALLOW_IPS: 127.0.0.1
            TRUSTED_PROXY_HOPS: '1'
            ALLOWED_HOSTS: '["admin.yohaneowo.com","yohaneowo-admin-web","web"]'
        volumes:
            - upload:/home/static/upload
        # The MySQL resource lives on Coolify's shared network, so backend joins it too.
        networks:
            - default
            - coolify
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    python -c 'import urllib.request; urllib.request.urlopen(urllib.request.Request("http://localhost:8001/api/v1/monitor/health/check", headers={"X-Forwarded-Proto": "https"}), timeout=5)'
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 60s

    web:
        build:
            context: .
            dockerfile: docker/coolify/web.Dockerfile
        restart: unless-stopped
        environment:
            # Coolify assigns the public domain to this service's port 80.
            SERVICE_FQDN_WEB_80: ''
        depends_on:
            - backend
        networks:
            default:
            coolify:
                aliases:
                    - yohaneowo-admin-web

volumes:
    redis:
    upload:

networks:
    coolify:
        external: true
