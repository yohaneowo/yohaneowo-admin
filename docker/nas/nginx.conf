# ============================================
# yohaneowo-admin 在 NAS 上的 Nginx 配置
# ============================================
# 与 docker/nginx/nginx.conf（公网服务器版）的差别：
# - 只听 HTTP。局域网直接用 http://NAS:端口；以后要对外时 HTTPS 由 Cloudflare Tunnel 负责，
#   这里不放证书。
# - 后端在 prod 环境会把非 https 请求 301 到 https（CustomHTTPSRedirectMiddleware 只看
#   X-Forwarded-Proto 头），所以这里固定传 https 让它放行。后端的 uvicorn 不信任这个头
#   （FORWARDED_ALLOW_IPS=127.0.0.1），request.url 仍是 http，生成的文件链接才对。
# - 真实客户端 IP 用 X-Real-IP 传给后端（app/utils/ip_local_util.py 读它做登录限流与日志）。
# - yohaneowo-bot 也经由这里访问内部 API：http://yohaneowo-admin-web/api/v1/bot/internal/*

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml image/x-icon;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 每 IP 每秒 30 个 API 请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    server {
        listen 80;
        server_name _;
        # 容器内听 80、对外是 WEB_PORT：跳转用相对路径，否则会丢掉端口
        absolute_redirect off;

        location = / {
            return 302 /web/;
        }

        # ==================== 前端（/web） ====================
        location /web {
            include cache-headers.inc;
            alias /usr/share/nginx/html/web/dist;
            try_files $uri $uri/ /web/index.html;
        }

        # ==================== 后端 API ====================
        location /api/v1 {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://backend:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            # 首页健康监控等 SSE 流要即时送达，不能被 nginx 缓冲住
            proxy_buffering off;
        }

        location ~ /\. { deny all; access_log off; log_not_found off; }
    }
}
